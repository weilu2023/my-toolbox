<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的个人工具工作台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>

</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">W</div><div><h1>我的工具库</h1><p>个人网站 · 云同步</p></div></div><div class="nav" id="nav"><button class="active" data-v="all">🏠 全部工具</button><button data-v="pinned">📌 我的置顶</button><button data-v="favorites">⭐ 我的收藏</button><button data-v="recent">🕘 最近使用</button><button data-v="custom">🧩 我添加的</button></div><div class="side-bottom"><button id="export">⬇ 导出备份</button><button id="import">⬆ 导入备份</button><input hidden type="file" id="file" accept=".json"><button id="theme">🌙 深色模式</button><button id="cloud">☁ 云同步</button></div></aside><main class="main"><div class="top"><div class="search">🔎 <input id="q" placeholder="搜索网站、功能、标签，比如 AI、PDF、论文……"></div><button class="sync" id="status">本地模式</button><button class="primary" id="add">＋ 添加网站</button></div><section class="hero"><div><h2>你的个人工具工作台</h2><p>收藏、置顶、自定义网站和最近使用都可以同步到云端。</p></div><div class="stats"><div class="stat"><strong id="nAll">0</strong><span>工具</span></div><div class="stat"><strong id="nFav">0</strong><span>收藏</span></div><div class="stat"><strong id="nCustom">0</strong><span>自定义</span></div></div></section><section id="recentSec"><div class="sec"><h3>最近使用</h3><span>自动记录</span></div><div class="recent" id="recent"></div></section><div class="sec"><h3 id="title">全部工具</h3><span id="sub">点击即可直达</span></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div></main></div>

<div class="back" id="cloudM"><div class="modal"><h3>☁ 多设备同步</h3><p style="color:var(--m);font-size:12px;line-height:1.6">部署完成后，用同一邮箱登录即可在电脑和手机之间同步。</p><div id="login"><div class="field"><label>登录邮箱</label><input type="email" id="email"></div><div class="ma"><button data-x="cloudM">关闭</button><button class="save" id="send">发送登录链接</button></div></div><div id="logged" style="display:none"><p id="who"></p><div class="ma"><button data-x="cloudM">关闭</button><button id="pull">从云端重新加载</button><button class="save" id="logout">退出</button></div></div></div></div><div class="toast" id="toast"></div>

const S={view:'all',cat:'全部',q:'',fav:new Set(JSON.parse(localStorage.getItem('wf')||'[]')),pin:new Set(JSON.parse(localStorage.getItem('wp')||'[]')),recent:JSON.parse(localStorage.getItem('wr')||'[]'),custom:JSON.parse(localStorage.getItem('wc')||'[]'),theme:localStorage.getItem('wt')||'light',user:null,ready:false};const $=x=>document.getElementById(x),cfg=window.TOOLBOX_CONFIG||{};let sb=null,timer=null;const all=()=>[...B,...S.custom.map(x=>({...x,custom:true}))],dom=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=u=>/^https?:\/\//i.test(u.trim())?u.trim():'https://'+u.trim();function toast(x){$('toast').textContent=x;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1700)}function pack(){return{favorites:[...S.fav],pinned:[...S.pin],recent:S.recent,custom:S.custom,theme:S.theme}}function apply(d){if(!d)return;S.fav=new Set(d.favorites||[]);S.pin=new Set(d.pinned||[]);S.recent=d.recent||[];S.custom=d.custom||[];S.theme=d.theme||'light';document.body.classList.toggle('dark',S.theme==='dark');$('theme').textContent=S.theme==='dark'?'☀️ 浅色模式':'🌙 深色模式'}function saveLocal(){localStorage.setItem('wf',JSON.stringify([...S.fav]));localStorage.setItem('wp',JSON.stringify([...S.pin]));localStorage.setItem('wr',JSON.stringify(S.recent));localStorage.setItem('wc',JSON.stringify(S.custom));localStorage.setItem('wt',S.theme)}function save(){saveLocal();if(!S.user||!S.ready||!sb)return;clearTimeout(timer);timer=setTimeout(async()=>{let{error}=await sb.from('user_toolbox').upsert({user_id:S.user.id,data:pack(),updated_at:new Date().toISOString()},{onConflict:'user_id'});$('status').textContent=error?'同步失败':'☁ 已同步'},600)}function record(x){S.recent=S.recent.filter(r=>r.url!==x.url);S.recent.unshift({name:x.name,url:x.url,category:x.category,time:Date.now()});S.recent=S.recent.slice(0,12);save();renderRecent()}function openS(x){record(x);window.open(x.url,'_blank','noopener,noreferrer')}function setNav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===S.view))}function data(){let d=all();if(S.view==='pinned')d=d.filter(x=>S.pin.has(x.url));if(S.view==='favorites')d=d.filter(x=>S.fav.has(x.url));if(S.view==='custom')d=d.filter(x=>x.custom);if(S.view==='recent'){let u=new Set(S.recent.map(x=>x.url));d=d.filter(x=>u.has(x.url));d.sort((a,b)=>S.recent.findIndex(x=>x.url===a.url)-S.recent.findIndex(x=>x.url===b.url))}if(S.view==='category')d=d.filter(x=>x.category===S.cat);let q=S.q.trim().toLowerCase();if(q)d=d.filter(x=>[x.name,x.url,x.category,x.desc,...(x.tags||[])].join(' ').toLowerCase().includes(q));d.sort((a,b)=>(S.pin.has(b.url)?1:0)-(S.pin.has(a.url)?1:0)||a.name.localeCompare(b.name,'zh-CN'));return d}function render(){let d=data();$('nAll').textContent=all().length;$('nFav').textContent=S.fav.size;$('nCustom').textContent=S.custom.length;let m={all:['全部工具','所有常用网站统一整理'],pinned:['我的置顶','最常用的网站'],favorites:['我的收藏','你标记过的网站'],recent:['最近使用','按最近打开顺序'],custom:['我添加的','你自己新增的网站'],category:[S.cat,'分类：'+S.cat]}[S.view];$('title').textContent=m[0];$('sub').textContent=m[1];$('grid').innerHTML='';d.forEach(x=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<div class="head"><div class="id"><img class="ico" src="https://icons.duckduckgo.com/ip3/${esc(dom(x.url))}.ico"><div><div class="name">${esc(x.name)}</div><div class="domain">${esc(dom(x.url))}</div></div></div><button class="pin">${S.pin.has(x.url)?'📌':'📍'}</button></div><div class="desc">${esc(x.desc||'')}</div><div class="tags">${(x.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="acts"><button class="go">打开</button><button class="fav">${S.fav.has(x.url)?'★ 已收藏':'☆ 收藏'}</button>${x.custom?'<button class="del">删除</button>':'<button class="copy">复制</button>'}</div>`;c.querySelector('.go').onclick=()=>openS(x);c.querySelector('.pin').onclick=()=>{S.pin.has(x.url)?S.pin.delete(x.url):S.pin.add(x.url);save();render()};c.querySelector('.fav').onclick=()=>{S.fav.has(x.url)?S.fav.delete(x.url):S.fav.add(x.url);save();render()};if(x.custom)c.querySelector('.del').onclick=()=>{if(confirm('删除「'+x.name+'」？')){S.custom=S.custom.filter(z=>z.url!==x.url);save();render()}};else c.querySelector('.copy').onclick=async()=>{await navigator.clipboard.writeText(x.url);toast('链接已复制')};$('grid').appendChild(c)});renderRecent();renderChips()}function renderRecent(){let d=S.recent.slice(0,5);$('recentSec').style.display=d.length?'block':'none';$('recent').innerHTML=d.map(x=>`<div class="r" data-u="${esc(x.url)}"><small>${esc(x.category||'最近')}</small><strong>${esc(x.name)}</strong><small>${esc(dom(x.url))}</small></div>`).join('');document.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{let x=all().find(z=>z.url===e.dataset.u)||S.recent.find(z=>z.url===e.dataset.u);if(x)openS(x)})}function renderChips(){let cs=['全部','AI与科研','图片设计','PDF工具','开发与效率','学习与资源','实用工具'];$('chips').innerHTML=cs.map(c=>`<button class="chip ${(c==='全部'&&S.view==='all')||(S.view==='category'&&S.cat===c)?'on':''}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(b.dataset.c==='全部')S.view='all';else{S.view='category';S.cat=b.dataset.c}setNav();render()})}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;setNav();render()});$('q').oninput=e=>{S.q=e.target.value;render()};$('add').onclick=()=>$('siteM').style.display='flex';$('cloud').onclick=()=>$('cloudM').style.display='flex';document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>$((b.dataset.x)).style.display='none');['siteM','cloudM'].forEach(id=>$(id).onclick=e=>{if(e.target===$(id))$(id).style.display='none'});$('save').onclick=()=>{let n=$('sn').value.trim(),u=$('su').value.trim();if(!n||!u){toast('请填写名称和网址');return}u=norm(u);if(all().some(x=>x.url===u)){toast('网站已存在');return}S.custom.push({name:n,url:u,category:$('sc').value,desc:$('sd').value.trim(),tags:$('st').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),custom:true});['sn','su','sd','st'].forEach(id=>$(id).value='');$('siteM').style.display='none';save();render();toast('已添加')};$('theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',S.theme==='dark');$('theme').textContent=S.theme==='dark'?'☀️ 浅色模式':'🌙 深色模式';save()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,...pack()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的工具库备份.json';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{apply(JSON.parse(await e.target.files[0].text()));save();render();toast('导入成功')}catch{toast('导入失败')}e.target.value=''};async function cloudUI(){if(!S.user){S.ready=false;$('status').textContent='本地模式';$('login').style.display='block';$('logged').style.display='none';return}$('login').style.display='none';$('logged').style.display='block';$('who').textContent='已登录：'+(S.user.email||'');$('status').textContent='同步中…';let{data,error}=await sb.from('user_toolbox').select('data').eq('user_id',S.user.id).maybeSingle();if(!error&&data?.data){apply(data.data);saveLocal()}else if(!error){await sb.from('user_toolbox').upsert({user_id:S.user.id,data:pack()},{onConflict:'user_id'})}S.ready=!error;$('status').textContent=error?'同步异常':'☁ 已同步';render()}async function init(){if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('YOUR_'))return;sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);let{data}=await sb.auth.getSession();S.user=data.session?.user||null;sb.auth.onAuthStateChange(async(_,s)=>{S.user=s?.user||null;await cloudUI()});await cloudUI()}$('send').onclick=async()=>{if(!sb){toast('请先配置 Supabase');return}let email=$('email').value.trim();if(!email){toast('请输入邮箱');return}let{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});toast(error?'发送失败':'登录链接已发送')};$('logout').onclick=async()=>{await sb.auth.signOut();toast('已退出')};$('pull').onclick=cloudUI;document.body.classList.toggle('dark',S.theme==='dark');$('theme').textContent=S.theme==='dark'?'☀️ 浅色模式':'🌙 深色模式';render();init();
